<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VeriCloud Live</title>
<style>
:root{
  --bg:#0a1120;--bg2:#0e1830;--card:#121c33;--card2:#17223d;--line:rgba(148,163,184,.16);--line2:rgba(148,163,184,.28);
  --ink:#e8edf7;--soft:#a3adc2;--dim:#6b7690;
  --brand:#6366f1;--brand2:#06b6d4;--grad:linear-gradient(135deg,#6366f1 0%,#3b82f6 55%,#06b6d4 100%);
  --ok:#22c55e;--okbg:rgba(34,197,94,.12);--warn:#f59e0b;--warnbg:rgba(245,158,11,.12);--bad:#ef4444;--badbg:rgba(239,68,68,.12);--run:#38bdf8;--runbg:rgba(56,189,248,.12);
  --r:16px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);
  background:radial-gradient(1100px 600px at 85% -10%,rgba(99,102,241,.20),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(6,182,212,.12),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:22px;padding:0 28px;height:64px;background:rgba(10,17,32,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(99,102,241,.45);flex:none}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--soft);white-space:nowrap}
nav{display:flex;gap:6px;margin-left:18px;height:100%}
nav button{background:none;border:0;color:var(--soft);padding:0 14px;cursor:pointer;position:relative;font-weight:600;font-size:14.5px}
nav button:hover{color:var(--ink)}
nav button.active{color:var(--ink)}
nav button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
.spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.07)}
.pill{cursor:default}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill.on{border-color:rgba(34,197,94,.45);color:#bbf7d0}.pill.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.pill.off{border-color:rgba(239,68,68,.45);color:#fecaca}.pill.off i{background:var(--bad)}
.lang{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.lang button{border:0;background:none;padding:0 12px;height:26px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer}
.lang button.on{background:var(--grad);color:#fff}

/* ---------- layout ---------- */
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:1720px;margin:0 auto;padding:18px 28px 20px}
section.tab{flex:1;display:flex;flex-direction:column}
.grid{flex:1;display:grid;grid-template-columns:minmax(440px,5fr) 7fr;gap:20px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1050px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}nav{margin-left:0}main{padding:16px}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);position:relative}
.card.glow::before{content:"";position:absolute;inset:-1px;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,rgba(99,102,241,.55),rgba(6,182,212,.15) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch h2{font-size:17px;margin:0;font-weight:700}
.num{width:26px;height:26px;border-radius:8px;background:rgba(99,102,241,.18);color:#c7d2fe;font-size:13px;font-weight:800;display:grid;place-items:center;flex:none}
.muted{color:var(--soft);font-size:13px}

/* ---------- upload ---------- */
.drops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;min-height:178px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;padding:12px 10px;background:rgba(255,255,255,.02);transition:all .2s;position:relative;overflow:hidden}
.drop:hover{border-color:rgba(99,102,241,.7);background:rgba(99,102,241,.06)}
.drop.drag{border-color:var(--brand2);background:var(--runbg)}
.drop.has{border-style:solid;border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.05)}
.drop input{display:none}
.drop .ic{width:46px;height:46px;border-radius:12px;background:rgba(99,102,241,.14);color:#a5b4fc;display:grid;place-items:center;margin-bottom:4px}
.drop b{font-size:14.5px}
.drop small{color:var(--soft);font-size:12px;line-height:1.35}
.drop .hint{color:var(--dim);font-size:11.5px;margin-top:2px}
.drop img{max-width:100%;max-height:112px;border-radius:9px;object-fit:contain;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.drop .fname{font-size:11.5px;color:#bbf7d0;word-break:break-all}
.opt{margin-top:16px;display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid rgba(245,158,11,.28);background:rgba(245,158,11,.06);cursor:pointer}
.opt .t1{font-weight:700;font-size:14px;color:#fde68a}
.opt .t2{font-size:12.5px;color:var(--soft);margin-top:2px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;border-radius:999px;background:#334155;position:relative;cursor:pointer;margin:2px 0 0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:var(--warn)}.switch:checked::after{transform:translateX(18px)}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--soft);cursor:pointer}
label.chk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--brand);flex:none}
button.primary{width:100%;margin-top:18px;height:50px;border:0;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;cursor:pointer;box-shadow:0 8px 24px rgba(59,130,246,.35);transition:transform .15s,box-shadow .15s,filter .15s;display:flex;align-items:center;justify-content:center;gap:10px}
button.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 30px rgba(59,130,246,.5);filter:brightness(1.08)}
button.primary:disabled{background:#26324d;color:#7c879e;box-shadow:none;cursor:not-allowed}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* after submit: upload card shrinks so the result fits on one screen */
.upcard.compact .drop{min-height:92px;padding:8px;gap:3px}
.upcard.compact .drop img{max-height:56px}
.upcard.compact .drop .ic,.upcard.compact .drop small,.upcard.compact .drop .hint,.upcard.compact .opt,.upcard.compact label.chk{display:none}
.upcard.compact button.primary{margin-top:12px;height:44px}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px}
.appid{font:12px ui-monospace,Consolas,monospace;color:var(--dim);word-break:break-all}

/* ---------- result ---------- */
.rescard{flex:1;display:flex;flex-direction:column}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:24px;min-height:140px}
.empty svg{opacity:.6}
.result{display:none;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.result.PASS{background:var(--okbg);border-color:rgba(34,197,94,.35)}
.result.NEEDS_HUMAN_REVIEW{background:var(--warnbg);border-color:rgba(245,158,11,.35)}
.result.FAIL{background:var(--badbg);border-color:rgba(239,68,68,.35)}
.verdict{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.verdict .vi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff}
.PASS .verdict{color:#86efac}.PASS .vi{background:var(--ok)}
.NEEDS_HUMAN_REVIEW .verdict{color:#fcd34d}.NEEDS_HUMAN_REVIEW .vi{background:var(--warn)}
.FAIL .verdict{color:#fca5a5}.FAIL .vi{background:var(--bad)}
.why{margin-top:4px;color:var(--ink);font-size:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv>div{background:rgba(10,17,32,.55);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kv strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv>div>span{display:block;font-size:12px;color:var(--soft)}.kv strong{font-size:15px}
.simbar{position:relative;height:10px;background:rgba(255,255,255,.08);border-radius:6px;margin-top:8px}
.simbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.simbar em{position:absolute;left:80%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.lat{display:flex;height:28px;border-radius:8px;overflow:hidden;margin-top:8px;font-size:12px;color:#fff;font-weight:700}
.lat div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 8px}

/* ---------- pipeline ---------- */
.pipe{display:flex;flex-direction:column}
.timer{margin-left:auto;font:600 14px ui-monospace,Consolas,monospace;color:var(--soft);display:flex;align-items:center;gap:10px}
.timer b{color:var(--ink);font-size:16px}
.prog{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin:-4px 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s}
.arch{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin-bottom:14px;padding:12px 8px 10px;border-radius:14px;background:rgba(10,17,32,.45);border:1px solid var(--line)}
.svc{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center}
.svc+.svc::before{content:"";position:absolute;top:21px;right:calc(50% + 26px);width:calc(100% - 52px);height:2px;background:var(--line2);border-radius:2px}
.svc.ok::before,.svc.run::before,.svc.bad::before{background:linear-gradient(90deg,var(--ok),currentColor)}
.svc .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1.5px solid var(--line2);color:var(--dim);transition:all .3s;font-weight:800;font-size:18px}
.svc span{font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.25;transition:color .3s}
.svc.run{color:var(--run)}.svc.run .si{border-color:var(--run);background:var(--runbg);color:var(--run);animation:glow 1.2s ease-in-out infinite}.svc.run span{color:var(--run)}
.svc.ok{color:var(--ok)}.svc.ok .si{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.svc.ok span{color:var(--ink)}
.svc.bad{color:var(--bad)}.svc.bad .si{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.svc.bad span{color:#fca5a5}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--runbg)}}
.groups{flex:1;display:flex;flex-direction:column;gap:8px}
.grp{border:1px solid var(--line);border-radius:14px;padding:4px 14px 2px;background:rgba(10,17,32,.25)}
.grp h3{margin:5px 0 0;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:800}
ol.stages{list-style:none;margin:0;padding:0}
ol.stages li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:6px 0;border-top:1px solid var(--line);align-items:start;transition:opacity .3s}
ol.stages li:first-child{border-top:0}
ol.stages li.idle{opacity:.55}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--dim);background:var(--bg2)}
li.run .dot{border-color:var(--run);color:var(--run);animation:glow 1.2s ease-in-out infinite}
li.ok .dot{border-color:var(--ok);background:var(--ok);color:#fff}
li.bad .dot{border-color:var(--bad);background:var(--bad);color:#fff}
li.warn .dot{border-color:var(--warn);background:var(--warn);color:#fff}
.st b{font-size:14.5px;font-weight:650;line-height:1.35}.st div{font-size:12.5px;color:var(--soft);line-height:1.35}
li.bad .st div{color:#fca5a5}
.t{font:12px ui-monospace,Consolas,monospace;color:var(--soft);text-align:right;white-space:nowrap;padding-top:3px}

/* ---------- ops ---------- */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:22px}
@media (max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);border-top:3px solid var(--line2)}
.stat span{font-size:12.5px;color:var(--soft)}.stat strong{display:block;font-size:34px;margin-top:4px;font-weight:800}
.tablecard{flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
tbody tr:hover{background:rgba(255,255,255,.025)}
.tag{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.PASS{background:var(--okbg);color:#86efac}.tag.NEEDS_HUMAN_REVIEW{background:var(--warnbg);color:#fcd34d}.tag.FAIL{background:var(--badbg);color:#fca5a5}
.hidden{display:none!important}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line2);border-radius:16px;padding:24px;max-width:540px;width:92%;background:var(--card2);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,10,20,.7);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px;font-size:18px}
dialog input{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;font:13px ui-monospace,Consolas,monospace;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.row button{height:38px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600}
.row button.go{background:var(--grad);border:0;color:#fff}
code{font:12px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div>
    <div><h1>VeriCloud Live</h1><div class="sub" data-i18n="sub"></div></div>
  </div>
  <nav><button class="active" data-tab="verify" data-i18n="tabVerify"></button><button data-tab="ops" data-i18n="tabOps"></button></nav>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div>
  <span id="conn" class="hbtn pill"><i></i><span id="connTxt"></span></span>
  <button class="hbtn" id="setApi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="apiSettings"></span></button>
</header>

<main>
<section id="tab-verify" class="tab">
  <div class="grid">
    <div class="col">
      <div class="card upcard" id="upcard">
        <div class="ch"><span class="num">1</span><h2 data-i18n="upTitle"></h2></div>
        <div class="drops">
          <label class="drop" id="dropId"><input type="file" accept=".jpg,.jpeg,.png" id="fileId"></label>
          <label class="drop" id="dropBack"><input type="file" accept=".jpg,.jpeg,.png" id="fileBack"></label>
          <label class="drop" id="dropSelfie"><input type="file" accept=".jpg,.jpeg,.png" id="fileSelfie"></label>
        </div>
        <label class="opt"><input type="checkbox" class="switch" id="corrupt" role="switch"><span><div class="t1" data-i18n="faultTitle"></div><div class="t2" data-i18n="faultDesc"></div></span></label>
        <label class="chk"><input type="checkbox" id="consent"><span data-i18n="consent"></span></label>
        <button class="primary" id="submit" disabled></button>
        <div class="err" id="err"></div>
        <div class="appid" id="appid"></div>
      </div>
      <div class="card rescard">
        <div class="ch"><span class="num">3</span><h2 data-i18n="resTitle"></h2></div>
        <div class="empty" id="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M12 8v5M12 16h.01"/></svg><span data-i18n="resEmpty"></span></div>
        <div class="result" id="result"></div>
      </div>
    </div>

    <div class="card pipe glow">
      <div class="ch"><span class="num">2</span><h2 data-i18n="pipeTitle"></h2><div class="timer"><span data-i18n="elapsed"></span><b id="timer">00:00.0</b></div></div>
      <div class="prog"><i id="prog"></i></div>
      <div class="arch" id="arch"></div>
      <div class="groups" id="groups"></div>
    </div>
  </div>
</section>

<section id="tab-ops" class="tab hidden">
  <div class="stats" id="stats"></div>
  <div class="card tablecard"><div class="ch"><h2 data-i18n="latest"></h2><span class="muted" id="opsTime"></span></div>
    <table><thead><tr><th data-i18n="thApp"></th><th data-i18n="thStatus"></th><th data-i18n="thReason"></th><th data-i18n="thSim"></th><th data-i18n="thQueue"></th><th data-i18n="thWf"></th><th data-i18n="thProc"></th></tr></thead><tbody id="recent"><tr><td colspan="7" class="muted" data-i18n="loading"></td></tr></tbody></table>
  </div>
</section>
</main>

<dialog id="apiDlg">
  <h2 data-i18n="dlgTitle"></h2>
  <p class="muted" data-i18n-html="dlgDesc"></p>
  <input id="apiInput" placeholder="https://….execute-api.us-east-1.amazonaws.com">
  <div class="row"><button id="apiCancel" data-i18n="cancel"></button><button class="go" id="apiSave" data-i18n="save"></button></div>
</dialog>

<script>
'use strict';
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

// ---------- i18n ----------
const I18N = {
  en: {

let API = (new URLSearchParams(location.search).get('api') || window.VERICLOUD_API || store.get('vericloud_api') || '').replace(/\/+$/,'');
async function api(path, opts={}) {
  if (!API) throw new Error(t('eApi'));
  const r = await fetch(API + path, {...opts, signal: AbortSignal.timeout(15000)});
  const body = await r.json().catch(() => ({}));
  return {status: r.status, body};
}
let connState = {k:'connNone'};
function drawConn() { $('conn').className = 'hbtn pill ' + (connState.cls || ''); $('connTxt').textContent = t(connState.k, connState.p); }
async function checkConn() {
  if (!API) connState = {k:'connNone'};
  else try { const {status} = await api('/dashboard'); connState = status === 200 ? {k:'connOk', cls:'on'} : {k:'connErr', cls:'off', p:{s:status}}; }
  catch { connState = {k:'connDown', cls:'off'}; }
  drawConn();
}
$('setApi').onclick = () => { $('apiInput').value = API; $('apiDlg').showModal(); };
$('apiCancel').onclick = () => $('apiDlg').close();

// ---------- file selection ----------
const files = {id: null, back: null, selfie: null};
const DROPS = [['id','dropId','fileId','front','frontD'], ['back','dropBack','fileBack','back','backD'], ['selfie','dropSelfie','fileSelfie','selfie','selfieD']];
const previews = {};
function drawDrop(kind) {
  const [, dropId, , iconK, descK] = DROPS.find(d => d[0] === kind), drop = $(dropId), f = files[kind];
  [...drop.childNodes].forEach(n => { if (n.tagName !== 'INPUT') n.remove(); });
  drop.classList.toggle('has', !!f);
  const box = document.createElement('div'); box.style.display = 'contents';
  if (f) box.innerHTML = `<img alt="${t(iconK)}" src="${previews[kind]}"><b>${t(iconK)}</b><span class="fname">${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB</span>`;
  else box.innerHTML = `<div class="ic">${ICON[iconK]}</div><b>${t(iconK)}</b><small>${t(descK)}</small><span class="hint">${t('dropHint')}</span>`;
  drop.append(box);
}
let lastErr = null;
function showErr(k, p) { lastErr = k ? {k, p} : null; $('err').textContent = k ? t(k, p) : ''; }
function pick(kind, file) {
  if (!file) return;
  if (!/\.(jpe?g|png)$/i.test(file.name)) return showErr('eType');
  if (!file.size || file.size > 10 * 1024 * 1024) return showErr('eSize');
  files[kind] = file; showErr(null); $('upcard').classList.remove('compact');
  if (previews[kind]) URL.revokeObjectURL(previews[kind]);
  previews[kind] = URL.createObjectURL(file);
  drawDrop(kind); ready();
}
for (const [kind, dropId, inputId] of DROPS) {
  const drop = $(dropId);
  $(inputId).onchange = e => pick(kind, e.target.files[0]);
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => pick(kind, e.dataTransfer.files[0]));
}
let busy = false;
function ready() {
  const b = $('submit');
  b.disabled = busy || !files.id || !files.back || !files.selfie || !$('consent').checked;
  b.innerHTML = busy ? `<span class="spin"></span>${t('verifying')}` : t('submit');
}
$('consent').onchange = ready;
$('upcard').addEventListener('click', e => { if (!busy && e.target.closest('.drops')) $('upcard').classList.remove('compact'); });

// ---------- pipeline model ----------
const ARCH = [['s3','s3'],['sqs','sqs'],['starter','lambda'],['ocr','lambda'],['face','face'],['sfn','sfn'],['ddb','ddb'],['sns','sns']];
const GROUPS = [['gUpload',['links','idcard','selfie']], ['gProcess',['start','ocr','face','decide']], ['gResult',['save','notify']]];
const ORDER = GROUPS.flatMap(g => g[1]);
let lastArch = {}, lastSt = {};
function drawArch(state={}) {
  lastArch = state;
  $('arch').innerHTML = ARCH.map(([k, ic]) => `<div class="svc ${state[k]||''}"><div class="si">${ICON[ic]}</div><span>${t('sv_' + k)}</span></div>`).join('');
}
function drawStages(st={}) {
  lastSt = st;
  $('groups').innerHTML = GROUPS.map(([gk, keys]) => `<div class="grp"><h3>${t(gk)}</h3><ol class="stages">` + keys.map(k => {
    const s = st[k] || {}, i = ORDER.indexOf(k);
    const icon = s.cls === 'ok' ? '✓' : s.cls === 'bad' ? '✕' : s.cls === 'warn' ? '!' : String(i + 1);
    return `<li class="${s.cls || 'idle'}"><span class="dot">${icon}</span><span class="st"><b>${t('s_' + k)}</b><div>${esc(s.note || t('d_' + k))}</div></span><span class="t">${s.t || ''}</span></li>`;
  }).join('') + '</ol></div>').join('');
  const done = ORDER.filter(k => st[k] && (st[k].cls === 'ok' || st[k].cls === 'bad')).length;
  $('prog').style.width = (done / ORDER.length * 100) + '%';
}

const ms = s => s ? new Date(s).getTime() : null;
const rel = (x, t0) => (x && t0) ? '+' + ((x - t0) / 1000).toFixed(1) + ' s' : '';
const kb = n => n < 1024 ? n + ' B' : (n/1024).toFixed(0) + ' KB';
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let lastRender = null, lastResult = null;
function render(tr, t0, local) {
  lastRender = [tr, t0, local];
  const st = {}, arch = {};
  const step = n => (tr.steps || []).find(s => s.name === n);
  const any = pre => (tr.steps || []).find(s => s.name && s.name.startsWith(pre));
  st.links = {cls:'ok', t: rel(local.links, t0)};
  const up = tr.uploads || {}, front = up.id_card_front || up.id_card, back = up.id_card_back, sfUp = up.selfie;
  const idUp = front && back ? {key: t('frontBack'), size: front.size + back.size} : front;
  st.idcard = idUp ? {cls:'ok', t: rel(local.idDone, t0), note:`${idUp.key} · ${kb(idUp.size)}`} : {cls: local.idDone ? 'run' : ''};
  st.selfie = sfUp ? {cls:'ok', t: rel(local.selfieDone, t0), note:`${sfUp.key} · ${kb(sfUp.size)}${local.corrupt ? t('truncated') : ''}`} : {cls: local.selfieDone ? 'run' : ''};
  if (idUp || sfUp) arch.s3 = 'ok';
  const ex = tr.execution;
  if (ex) {
    const joined = up.id_card_front && up.id_card ? t('joined', {p: up.id_card.key.split('/').slice(0,2).join('/')}) : '';
    st.start = {cls:'ok', t: rel(ms(ex.started_at), t0), note: joined + (tr.result?.received_at ? t('received', {t: new Date(tr.result.received_at).toLocaleTimeString(), s: ex.status}) : t('execOnly', {s: ex.status}))};
    arch.sqs = arch.starter = 'ok'; arch.sfn = ex.status === 'RUNNING' ? 'run' : ex.status === 'SUCCEEDED' ? 'ok' : 'bad';
  } else if (sfUp) {
    const waited = (Date.now() - (local.selfieDone || Date.now())) / 1000;
    if (local.rejected || waited > 25) {
      local.rejected = true;
      st.start = {cls:'bad', note: t('rejected')};
      arch.sqs = 'run'; arch.starter = 'bad';
    } else { st.start = {cls:'run', note: t('waitStarter')}; arch.sqs = 'run'; }
  }
  const branch = (inv, err, key, archKey, label) => {
    const s = step(inv), e = step(err);
    if (e) { st[key] = {cls:'bad', t: rel(ms(e.entered_at), t0), note: t('bFail', {l: label})}; arch[archKey] = 'bad'; }
    else if (s && s.exited_at) { st[key] = {cls:'ok', t: rel(ms(s.exited_at), t0), note: t('bDone', {l: label, s: ((ms(s.exited_at) - ms(s.entered_at))/1000).toFixed(1)})}; arch[archKey] = 'ok'; }
    else if (s) { st[key] = {cls:'run', t: rel(ms(s.entered_at), t0), note: t('bRun', {l: label})}; arch[archKey] = 'run'; }
  };
  branch('OCR_Invoke', 'OCR_Record_Error', 'ocr', 'ocr', t('lOcr'));
  branch('Face_Invoke', 'Face_Record_Error', 'face', 'face', t('lFace'));
  const d = any('Decision_');
  if (d) st.decide = {cls:'ok', t: rel(ms(d.entered_at), t0), note: d.name.replace('Decision_','').replace(/_/g,' ')};
  const p = any('Persist_');
  if (p) { st.save = {cls: p.exited_at ? 'ok' : 'run', t: rel(ms(p.exited_at || p.entered_at), t0), note: p.name}; arch.ddb = p.exited_at ? 'ok' : 'run'; }
  const r = tr.result;
  if (r) {
    st.save = st.save || {cls:'ok'}; st.save.cls = 'ok'; arch.ddb = 'ok';
    st.notify = {cls:'ok', note: t('notifyNote')}; arch.sns = 'ok';
  }
  drawArch(arch); drawStages(st);
  if (r) showResult(r);
}

function showResult(r) {
  lastResult = r;
  const box = $('result'); box.className = 'result ' + r.review_status; box.style.display = 'block'; $('empty').classList.add('hidden');
  const ocr = r.ocr, sim = typeof r.similarity === 'number' ? r.similarity : null;
  const c = ms(r.created_at), rc = ms(r.received_at), pr = ms(r.processed_at);
  const q = rc && c ? (rc - c) / 1000 : null, w = pr && rc ? (pr - rc) / 1000 : null;
  const vi = {PASS:'✓', NEEDS_HUMAN_REVIEW:'!', FAIL:'✕'}[r.review_status] || '?';
  box.innerHTML = `<div class="verdict"><span class="vi">${vi}</span>${esc(I18N[LANG][r.review_status] ? t(r.review_status) : r.review_status)}</div>
    <div class="why">${esc(I18N.en['r_' + r.reason] ? t('r_' + r.reason) : r.reason)}</div>
    <div class="kv">
      ${ocr ? `<div><span>${t('kName')}</span><strong>${esc(ocr.name)}</strong></div>
      <div><span>${t('kId')}</span><strong>${esc(ocr.id_number_masked)}</strong></div>
      <div><span>${t('kExp')}</span><strong>${ocr.expiry_date === '9999-12-31' ? t('longTerm') : esc(ocr.expiry_date)} · ${ocr.id_valid ? t('valid') : t('expired')}</strong></div>
      <div><span>${t('kAuth')}</span><strong>${esc(ocr.issuing_authority)}</strong></div>` : `<div><span>${t('kOcr')}</span><strong>${t('noFields')}</strong></div>`}
      <div style="grid-column:span 2"><span>${t('kSim')}</span><strong>${sim !== null ? sim.toFixed(2) : esc(r.face_error || '—')}</strong>
        ${sim !== null ? `<div class="simbar"><i style="width:${Math.max(0, Math.min(100, sim))}%;background:${sim >= 80 ? 'var(--ok)' : 'var(--warn)'}"></i><em title="80"></em></div>` : ''}</div>
    </div>
    ${q !== null && w !== null ? `<div class="kv"><div style="grid-column:1/-1"><span>${t('latTitle', {q: q.toFixed(1), w: w.toFixed(1)})}</span>
      <div class="lat"><div style="flex:${Math.max(q,.3)};background:#475569">${t('latQ', {q: q.toFixed(1)})}</div><div style="flex:${Math.max(w,.3)};background:linear-gradient(90deg,#6366f1,#06b6d4)">${t('latW', {w: w.toFixed(1)})}</div></div></div></div>` : ''}`;
}

// ---------- timer ----------
let timerId = null;
function startTimer(t0) {
  clearInterval(timerId);
  timerId = setInterval(() => { const s = (Date.now() - t0) / 1000; $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + (s % 60).toFixed(1).padStart(4, '0'); }, 100);
}
const stopTimer = () => clearInterval(timerId);

// ---------- submit ----------
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const ext = f => '.' + f.name.split('.').pop().toLowerCase();
class UiError extends Error { constructor(k, p) { super(k); this.k = k; this.p = p; } }
async function put(url, body) {
  const r = await fetch(url, {method:'PUT', body, signal: AbortSignal.timeout(60000)});
  if (!r.ok) throw new UiError('ePut', {s: r.status});
}
let appId = null;
$('submit').onclick = async () => {
  if (busy) return;
  busy = true; ready(); showErr(null); $('upcard').classList.add('compact');
  $('result').style.display = 'none'; $('empty').classList.remove('hidden'); lastResult = null; lastRender = null;
  const id = uuid(), corrupt = $('corrupt').checked, local = {corrupt};
  appId = id; $('appid').textContent = t('appId', {id});
  const t0 = Date.now(); startTimer(t0); drawArch(); drawStages({links:{cls:'run'}});
  try {
    if (!API) throw new UiError('eApi');
    const {status, body} = await api('/applications', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({application_id:id, id_card_extension:ext(files.id), id_card_back_extension:ext(files.back), selfie_extension:ext(files.selfie)})});
    if (status !== 200) { if (body.error) throw new Error(body.error); throw new UiError('eCreate', {s: status}); }
    local.links = Date.now(); drawStages({links:{cls:'ok', t: rel(local.links, t0)}, idcard:{cls:'run'}}); drawArch({s3:'run'});
    if (!body.id_card_back_url) throw new UiError('eBack');
    await put(body.id_card_url, files.id); await put(body.id_card_back_url, files.back); local.idDone = Date.now();
    drawStages({links:{cls:'ok', t: rel(local.links, t0)}, idcard:{cls:'ok', t: rel(local.idDone, t0)}, selfie:{cls:'run'}});
    const selfieBody = corrupt ? files.selfie.slice(0, Math.max(200, Math.floor(files.selfie.size * 0.35)), files.selfie.type) : files.selfie;
    await put(body.selfie_url, selfieBody); local.selfieDone = Date.now();
    const deadline = Date.now() + 180000;
    while (Date.now() < deadline) {
      const tr = await api('/applications/' + id + '/trace');
      if (tr.status === 200) {
        render(tr.body, t0, local);
        if (tr.body.result) break;
        if (!tr.body.execution && (Date.now() - local.selfieDone) > 40000) break;   // rejected at pre-check
      }
      await sleep(1500);
    }
    checkConn();
  } catch (e) { if (e instanceof UiError) showErr(e.k, e.p); else { lastErr = null; $('err').textContent = e.message || String(e); } }
  finally { busy = false; stopTimer(); ready(); }
};

// ---------- operations ----------
let opsTimer = null, opsData = null, opsAt = null;
function drawOps() {
  if (!opsData) return;
  const body = opsData, c = body.counts, q = body.queues || {}, x = body.executions || {};
  const stat = (k, v, color) => `<div class="stat" style="border-top-color:${color || 'var(--line2)'}"><span>${t(k)}</span><strong style="color:${color || 'inherit'}">${v ?? '—'}</strong></div>`;
  $('stats').innerHTML = stat('oPass', c.PASS, 'var(--ok)') + stat('oReview', c.NEEDS_HUMAN_REVIEW, 'var(--warn)') + stat('oFail', c.FAIL, 'var(--bad)')
    + stat('oRun', x.RUNNING, 'var(--run)') + stat('oQueue', q.ingest ? q.ingest.waiting + ' / ' + q.ingest.in_flight : '—', '#a5b4fc')
    + stat('oDlq', q.dlq ? q.dlq.waiting + q.dlq.in_flight : '—', 'var(--bad)');
  $('recent').innerHTML = body.recent.length ? body.recent.map(r => {
    const c0 = ms(r.created_at), rc = ms(r.received_at), pr = ms(r.processed_at);
    const label = {PASS: 'oPass', NEEDS_HUMAN_REVIEW: 'oReview', FAIL: 'oFail'}[r.review_status];
    return `<tr><td class="appid">${esc(r.application_id).slice(0, 8)}…</td><td><span class="tag ${esc(r.review_status)}">${label ? t(label) : esc(r.review_status)}</span></td><td>${esc(I18N.en['r_' + r.reason] ? t('r_' + r.reason) : r.reason)}</td>
      <td>${typeof r.similarity === 'number' ? r.similarity.toFixed(1) : '—'}</td><td>${rc && c0 ? ((rc - c0)/1000).toFixed(1) + ' s' : '—'}</td>
      <td>${pr && rc ? ((pr - rc)/1000).toFixed(1) + ' s' : '—'}</td><td>${esc((r.processed_at || '').replace('T',' ').slice(0,19))}</td></tr>`;
  }).join('') : `<tr><td colspan="7" class="muted">${t('noApps')}</td></tr>`;
  $('opsTime').textContent = t('refreshed', {t: opsAt});
}
async function refreshOps() {
  clearTimeout(opsTimer);
  if ($('tab-ops').classList.contains('hidden')) return;
  try {
    const {status, body} = await api('/dashboard');
    if (status !== 200) throw new Error(t('connErr', {s: status}));
    opsData = body; opsAt = new Date().toLocaleTimeString(); drawOps();
  } catch (e) { $('opsTime').textContent = '· ' + e.message; }
  opsTimer = setTimeout(refreshOps, 5000);
}

// ---------- language ----------
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  DROPS.forEach(d => drawDrop(d[0])); ready(); drawConn();
  if (appId) $('appid').textContent = t('appId', {id: appId});
  if (lastErr) $('err').textContent = t(lastErr.k, lastErr.p);
  if (lastRender) render(...lastRender); else { drawArch(lastArch); drawStages(lastSt); }
  if (lastResult) showResult(lastResult);
  drawOps();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set('vericloud_lang', LANG); applyLang(); });

applyLang();
checkConn();
if (!API) $('apiDlg').showModal();
</script>
</body>
</html>
